<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>COMP101 Lec 2 Interactive Activities</title><style>
:root{--pink:#d64abf;--purple:#744e96;--navy:#1f2b40;--teal:#13a8aa;--bg:#faf7fc;--card:#fff;--line:#ead5e9}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(180deg,#fff,#faf3fb);color:var(--navy)}header{background:var(--navy);color:white;padding:22px 16px;text-align:center}header small{color:#e9d7ec}.wrap{max-width:820px;margin:auto;padding:18px}.home{display:grid;gap:12px}.tile,.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:18px;box-shadow:0 8px 20px #00000012}.tile button,.primary{width:100%;border:0;border-radius:18px;padding:15px 16px;background:var(--pink);color:white;font-weight:700;font-size:16px}.secondary{background:white;color:var(--navy);border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-weight:700}h2{margin:8px 0;color:var(--purple)}.q{margin:14px 0;padding:14px;border:1px solid var(--line);border-radius:18px;background:#fff}.opt{display:block;margin:8px 0;padding:12px;border:1px solid var(--line);border-radius:14px;background:#fcfafd}.textanswer{width:100%;margin-top:10px;padding:12px;border:1px solid var(--line);border-radius:14px;font-size:16px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.actions button{flex:1;min-width:140px;border:0;border-radius:14px;padding:13px;font-weight:700}.check{background:var(--teal);color:white}.back{background:#eee;color:#333}.feedback{font-weight:700;margin-top:8px}.score{font-size:22px;font-weight:800;color:var(--purple);margin-top:10px}.hide{display:none}.hint{font-size:14px;color:#596273;margin-top:5px;line-height:1.45}</style></head><body><header><h1>COMP101 — Lecture 2</h1><small>Hardware, Software and Connectivity • Interactive Activities</small></header><main class="wrap"><section id="home" class="home"><div class="card"><h2>Choose today’s activity</h2><p>Open the activity your teacher asks for during the lecture.</p></div></section><section id="activity" class="hide"></section></main><script>
const activities={
bridge:{title:'Bridge to Today',intro:'Connect Lec 1 to Lec 2.',questions:[{q:'Last lecture focused on information systems. Which cycle did we use?',opts:['Input → Process → Output','Hardware → Software → Network','RAM → ROM → CPU'],a:0},{q:'Today we move from the full information system to the inside of the computer. Which two parts form the basic computer system in today’s lecture?',opts:['Data and Wisdom','Hardware and Software','LAN and WAN'],a:1},{q:'Prediction: which part is called the brain of the computer?',opts:['CPU / Processor','Monitor','USB'],a:0}]},
system:{title:'Hardware or Software?',intro:'Sort each item.',questions:[{q:'Keyboard',opts:['Hardware','Software'],a:0},{q:'Programs / instructions',opts:['Hardware','Software'],a:1},{q:'Monitor',opts:['Hardware','Software'],a:0},{q:'Operating system',opts:['Hardware','Software'],a:1},{q:'System unit',opts:['Hardware','Software'],a:0}]},
input:{title:'Find the Input Device',intro:'Input devices convert external data into electronic signals.',questions:[{q:'Which one is an input device?',opts:['Printer','Keyboard','Speaker'],a:1},{q:'Which device can scan printed data into the computer?',opts:['Scanner','Monitor','Data projector'],a:0},{q:'Which device can input sound?',opts:['Microphone','Hard drive','Speaker'],a:0},{q:'Which item is NOT an input device?',opts:['Mouse','Barcode reader','Printer'],a:2}]},
inside:{title:'Inside the System Unit',intro:'Match each component to its role.',questions:[{q:'The main circuit board of the system unit is:',opts:['Motherboard','RAM','Power supply'],a:0},{q:'The brain of the computer is:',opts:['CPU / Processor','USB','Monitor'],a:0},{q:'Permanent memory that helps the computer start up:',opts:['RAM','ROM','CD/DVD'],a:1},{q:'Temporary memory used while the computer is working:',opts:['RAM','Hard drive','Power supply'],a:0},{q:'Converts wall socket power to computer power:',opts:['Power supply','Motherboard','Scanner'],a:0}]},
storage:{title:'Storage Detective',intro:'Primary or secondary storage?',questions:[{q:'RAM is:',opts:['Primary storage','Secondary storage'],a:0},{q:'USB is:',opts:['Primary storage','Secondary storage'],a:1},{q:'External hard drive is:',opts:['Primary storage','Secondary storage'],a:1},{q:'SD Card is:',opts:['Primary storage','Secondary storage'],a:1},{q:'Hard disk stores data:',opts:['Temporarily only','Permanently'],a:1}]},
exit:{title:'Exit Ticket — Lecture 2: Hardware',intro:'Final 4 short questions. Write a brief answer, then check the suggested answer.',questions:[
{q:'Name the four main categories of computer hardware.',type:'text',answer:'Input devices / Output devices / System unit / Secondary storage devices',keywords:['input','output','system','storage']},
{q:'Give one example of an input device and one example of an output device.',type:'text',answer:'Example: Keyboard or mouse as input; monitor or printer as output.',keywords:['keyboard|mouse|scanner|microphone|camera|barcode|touchscreen','monitor|printer|speaker|headset|projector']},
{q:'What is the role of the CPU?',type:'text',answer:'The CPU acts as the brain of the computer and carries out/manipulates data and program instructions.',keywords:['brain','instruction|data|process|manipulat|carry']},
{q:'What is one difference between RAM and a hard drive?',type:'text',answer:'RAM stores data temporarily, while the hard drive stores data permanently.',keywords:['temporary|temporarily','permanent|permanently|hard drive']}
]}
};
const labels=[['bridge','Bridge to Today'],['system','Activity 1: Hardware or Software?'],['input','Activity 2: Find the Input Device'],['inside','Activity 3: Inside the System Unit'],['storage','Activity 4: Storage Detective'],['exit','Exit Ticket']];
const home=document.getElementById('home'),act=document.getElementById('activity');labels.forEach(([id,label])=>{const d=document.createElement('div');d.className='tile';d.innerHTML=`<button onclick="openAct('${id}')">${label}</button>`;home.appendChild(d)});
function openAct(id){const a=activities[id]; home.classList.add('hide'); act.classList.remove('hide'); act.innerHTML=`<div class="card"><button class="secondary" onclick="goHome()">← Back to activities</button><h2>${a.title}</h2><p>${a.intro}</p><form id="form">${a.questions.map((q,i)=>renderQuestion(q,i)).join('')}<div class="actions"><button class="check" type="submit">Check Answer</button><button type="button" class="back" onclick="openAct('${id}')">Try Again</button></div><div id="score" class="score"></div></form></div>`;document.getElementById('form').onsubmit=e=>{e.preventDefault();checkActivity(a)};}
function renderQuestion(q,i){if(q.type==='text'){return `<div class="q"><b>${i+1}. ${q.q}</b><textarea class="textanswer" name="q${i}" rows="3" placeholder="Write your answer here..."></textarea><div id="f${i}" class="feedback"></div></div>`}return `<div class="q"><b>${i+1}. ${q.q}</b>${q.opts.map((o,j)=>`<label class="opt"><input type="radio" name="q${i}" value="${j}"> ${o}</label>`).join('')}<div id="f${i}" class="feedback"></div></div>`}
function checkActivity(a){let s=0;a.questions.forEach((q,i)=>{const f=document.getElementById('f'+i);if(q.type==='text'){const val=(document.querySelector(`[name=q${i}]`).value||'').toLowerCase();let ok=q.keywords.every(group=>group.split('|').some(k=>val.includes(k.toLowerCase()))); if(ok)s++; f.innerHTML=(ok?'✓ Good answer':'Suggested answer')+': <span class="hint">'+q.answer+'</span>';return}const v=document.querySelector(`input[name=q${i}]:checked`);if(!v){f.textContent='Please choose an answer.';return}if(+v.value===q.a){s++;f.textContent='✓ Correct'}else{f.textContent='✗ Correct answer: '+q.opts[q.a]}});document.getElementById('score').textContent=`Your score: ${s} / ${a.questions.length}`;}
function goHome(){act.classList.add('hide');home.classList.remove('hide')}
</script></body></html>
